<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Stick Figure Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0d12;
    font-family:Arial,sans-serif;
    color:white;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:65px;
    background:#11141b;
    border-bottom:1px solid #292e39;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#8b6cff;
}

.status{
    color:#8e96a8;
    font-size:13px;
}

.workspace{
    flex:1;
    display:flex;
    min-height:calc(100vh - 65px);
}

.scene{
    flex:1;
    padding:25px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.canvasBox{
    width:100%;
    max-width:1000px;
    height:650px;
    max-height:80vh;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 25px 80px rgba(0,0,0,.4);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.controls{
    width:310px;
    background:#11141b;
    border-left:1px solid #292e39;
    padding:22px;
    overflow:auto;
}

h2{
    margin:0 0 22px;
    font-size:20px;
}

.section{
    margin-bottom:24px;
}

.label{
    color:#8992a5;
    font-size:12px;
    margin-bottom:10px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    border:0;
    padding:12px 8px;
    border-radius:10px;
    background:#1d222c;
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

button:hover{
    background:#292f3b;
}

button.active{
    background:#8064ff;
}

.full{
    width:100%;
}

.play{
    background:#8064ff;
    font-weight:bold;
    margin-top:8px;
}

input{
    width:100%;
}

@media(max-width:850px){

    .workspace{
        flex-direction:column;
    }

    .scene{
        min-height:55vh;
        padding:10px;
    }

    .canvasBox{
        height:55vh;
    }

    .controls{
        width:100%;
        border-left:0;
        border-top:1px solid #292e39;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        🎬 <span>Stick Figure</span> Studio
    </div>

    <div class="status" id="status">
        ● جاهز
    </div>
</header>


<div class="workspace">

    <div class="scene">

        <div class="canvasBox">
            <canvas id="canvas"></canvas>
        </div>

    </div>


    <div class="controls">

        <h2>🎭 الشخصية</h2>


        <div class="section">

            <div class="label">
                الحركات
            </div>

            <div class="buttons">

                <button
                    id="idleBtn"
                    onclick="setAnimation('idle')">
                    🧍 وقوف
                </button>

                <button
                    id="walkBtn"
                    onclick="setAnimation('walk')">
                    🚶 مشي
                </button>

                <button
                    id="runBtn"
                    onclick="setAnimation('run')">
                    🏃 ركض
                </button>

                <button
                    id="jumpBtn"
                    onclick="setAnimation('jump')">
                    🦘 قفز
                </button>

                <button
                    id="waveBtn"
                    onclick="setAnimation('wave')">
                    👋 تلويح
                </button>

                <button
                    id="fallBtn"
                    onclick="setAnimation('fall')">
                    😵 سقوط
                </button>

            </div>

        </div>


        <div class="section">

            <div class="label">
                سرعة الحركة
            </div>

            <input
                id="speed"
                type="range"
                min=".3"
                max="3"
                value="1"
                step=".1">

        </div>


        <div class="section">

            <div class="label">
                الخلفية
            </div>

            <div class="buttons">

                <button onclick="setBackground('#ffffff')">
                    أبيض
                </button>

                <button onclick="setBackground('#f1f5f9')">
                    رمادي
                </button>

                <button onclick="setBackground('#eaf2ff')">
                    أزرق
                </button>

                <button onclick="setBackground('#111827')">
                    ليلي
                </button>

            </div>

        </div>


        <button
            class="play full"
            onclick="togglePlay()">

            ▶ تشغيل / إيقاف

        </button>

    </div>

</div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let W = 0;
let H = 0;

let time = 0;

let playing = true;

let animation = "idle";

let speed = 1;

let background = "#ffffff";


/* =========================
   إعداد الشاشة
========================= */

function resize(){

    const rect =
        canvas.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   أدوات الرسم
========================= */

function line(
    x1,y1,
    x2,y2,
    width=8
){

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.lineWidth = width;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#111111";

    ctx.stroke();
}


function circle(
    x,y,r,
    fill=false
){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    if(fill){

        ctx.fillStyle =
            "#111111";

        ctx.fill();

    }else{

        ctx.lineWidth = 7;

        ctx.strokeStyle =
            "#111111";

        ctx.stroke();
    }
}


/* =========================
   اليد
========================= */

function hand(x,y){

    /*
       كف صغير أسود
    */

    ctx.save();

    ctx.fillStyle="#111111";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       الأصابع
    */

    for(let i=0;i<4;i++){

        const angle =
            -1.8 + i*.35;

        const x2 =
            x + Math.cos(angle)*9;

        const y2 =
            y + Math.sin(angle)*9;

        line(
            x,
            y,
            x2,
            y2,
            4
        );
    }

    ctx.restore();
}


/* =========================
   القدم
========================= */

function foot(x,y){

    ctx.save();

    ctx.fillStyle="#111111";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        22,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================
   الوجه
========================= */

function face(
    x,
    y,
    expression="happy"
){

    /*
       الرأس
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        58,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.lineWidth = 7;

    ctx.strokeStyle =
        "#111111";

    ctx.stroke();


    /*
       الشعر الصغير
    */

    line(
        x-10,
        y-55,
        x-15,
        y-68,
        5
    );

    line(
        x-2,
        y-57,
        x,
        y-72,
        5
    );

    line(
        x+7,
        y-56,
        x+12,
        y-67,
        5
    );


    /*
       العيون
    */

    ctx.fillStyle =
        "#111111";

    ctx.beginPath();

    ctx.ellipse(
        x-20,
        y-5,
        9,
        17,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x+20,
        y-5,
        9,
        17,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       الحواجب
    */

    if(expression==="angry"){

        line(
            x-30,
            y-30,
            x-10,
            y-24,
            5
        );

        line(
            x+10,
            y-24,
            x+30,
            y-30,
            5
        );

    }else{

        line(
            x-31,
            y-27,
            x-10,
            y-31,
            5
        );

        line(
            x+10,
            y-31,
            x+31,
            y-27,
            5
        );
    }


    /*
       الفم
    */

    if(expression==="happy"){

        ctx.beginPath();

        ctx.arc(
            x,
            y+5,
            22,
            0,
            Math.PI
        );

        ctx.lineWidth=5;

        ctx.stroke();

    }

    else if(expression==="surprised"){

        ctx.beginPath();

        ctx.arc(
            x,
            y+12,
            9,
            0,
            Math.PI*2
        );

        ctx.lineWidth=5;

        ctx.stroke();

    }

    else if(expression==="angry"){

        line(
            x-14,
            y+15,
            x+14,
            y+15,
            5
        );

    }

    else if(expression==="sad"){

        ctx.beginPath();

        ctx.arc(
            x,
            y+28,
            18,
            Math.PI,
            Math.PI*2
        );

        ctx.lineWidth=5;

        ctx.stroke();

    }
}


/* =========================
   الشخصية
========================= */

function drawCharacter(){

    let cx =
        W/2;

    let base =
        H-150;

    let headY =
        base-250;


    /*
       حركة القفز
    */

    let jump = 0;

    if(animation==="jump"){

        jump =
            Math.abs(
                Math.sin(time*.08)
            ) * 100;
    }


    /*
       السقوط
    */

    if(animation==="fall"){

        drawFalling(
            cx,
            base
        );

        return;
    }


    headY -= jump;

    base -= jump;


    /*
       حركة الجسم
    */

    let walk =
        Math.sin(time*.13);

    let legA = 0;
    let legB = 0;

    let armA = 0;
    let armB = 0;


    if(animation==="walk"){

        legA =
            walk*35;

        legB =
            -walk*35;

        armA =
            -walk*25;

        armB =
            walk*25;
    }


    if(animation==="run"){

        legA =
            walk*55;

        legB =
            -walk*55;

        armA =
            -walk*45;

        armB =
            walk*45;
    }


    /*
       الجسم
    */

    const neckY =
        headY+58;

    const hipY =
        base-100;


    /*
       الرأس
    */

    face(
        cx,
        headY,
        animation==="run"
        ? "happy"
        : "happy"
    );


    /*
       الرقبة / الجسم
    */

    line(
        cx,
        neckY,
        cx,
        hipY,
        9
    );


    /*
       الذراع اليسرى
    */

    let leftShoulderX =
        cx-3;

    let leftShoulderY =
        neckY+25;

    let leftElbowX =
        cx-65;

    let leftElbowY =
        neckY+65+armA;


    /*
       حركة التلويح
    */

    if(animation==="wave"){

        leftElbowX =
            cx-55;

        leftElbowY =
            neckY-5;

        line(
            leftShoulderX,
            leftShoulderY,
            leftElbowX,
            leftElbowY,
            9
        );

        line(
            leftElbowX,
            leftElbowY,
            cx-75,
            neckY-65,
            9
        );

        hand(
            cx-75,
            neckY-72
        );

    }else{

        line(
            leftShoulderX,
            leftShoulderY,
            leftElbowX,
            leftElbowY,
            9
        );

        line(
            leftElbowX,
            leftElbowY,
            cx-55,
            neckY+110,
            9
        );

        hand(
            cx-55,
            neckY+110
        );
    }


    /*
       الذراع اليمنى
    */

    let rightShoulderX =
        cx+3;

    let rightShoulderY =
        neckY+25;

    let rightElbowX =
        cx+65;

    let rightElbowY =
        neckY+65+armB;


    line(
        rightShoulderX,
        rightShoulderY,
        rightElbowX,
        rightElbowY,
        9
    );

    line(
        rightElbowX,
        rightElbowY,
        cx+55,
        neckY+110,
        9
    );

    hand(
        cx+55,
        neckY+110
    );


    /*
       الرجل اليسرى
    */

    const leftKneeX =
        cx-35+legA;

    const leftKneeY =
        hipY+80;


    line(
        cx,
        hipY,
        leftKneeX,
        leftKneeY,
        10
    );


    line(
        leftKneeX,
        leftKneeY,
        cx-55+legA,
        base,
        10
    );


    /*
       الرجل اليمنى
    */

    const rightKneeX =
        cx+35+legB;

    const rightKneeY =
        hipY+80;


    line(
        cx,
        hipY,
        rightKneeX,
        rightKneeY,
        10
    );


    line(
        rightKneeX,
        rightKneeY,
        cx+55+legB,
        base,
        10
    );


    /*
       الأقدام
    */

    foot(
        cx-55+legA,
        base+4
    );

    foot(
        cx+55+legB,
        base+4
    );
}


/* =========================
   شخصية السقوط
========================= */

function drawFalling(cx,base){

    const y =
        base-130;

    ctx.save();

    ctx.translate(
        cx,
        y
    );

    ctx.rotate(
        Math.sin(time*.08)*.2
    );


    /*
       الرأس
    */

    face(
        0,
        0,
        "surprised"
    );


    /*
       الجسم
    */

    line(
        0,
        58,
        0,
        150,
        9
    );


    /*
       اليدان والرجلان
    */

    line(
        0,
        80,
        -75,
        120,
        9
    );

    line(
        0,
        80,
        75,
        120,
        9
    );

    hand(
        -75,
        120
    );

    hand(
        75,
        120
    );


    line(
        0,
        150,
        -70,
        205,
        10
    );

    line(
        0,
        150,
        70,
        205,
        10
    );

    foot(
        -70,
        205
    );

    foot(
        70,
        205
    );

    ctx.restore();
}


/* =========================
   الخلفية
========================= */

function drawBackground(){

    ctx.fillStyle =
        background;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       الأرض
    */

    ctx.strokeStyle =
        background==="#111827"
        ? "#374151"
        : "#d9d9d9";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        H-145
    );

    ctx.lineTo(
        W,
        H-145
    );

    ctx.stroke();


    /*
       ظل الشخصية
    */

    ctx.fillStyle =
        "rgba(0,0,0,.12)";

    ctx.beginPath();

    ctx.ellipse(
        W/2,
        H-138,
        85,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   الرسم
========================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawCharacter();
}


/* =========================
   التحكم
========================= */

function setAnimation(type){

    animation =
        type;

    document
        .querySelectorAll("button")
        .forEach(
            b => b.classList.remove("active")
        );

    const btn =
        document.getElementById(
            type+"Btn"
        );

    if(btn){
        btn.classList.add("active");
    }

    document.getElementById(
        "status"
    ).textContent =
        "● الحركة: "+type;
}


function togglePlay(){

    playing =
        !playing;

    document.getElementById(
        "status"
    ).textContent =
        playing
        ? "● يعمل الآن"
        : "Ⅱ متوقف";
}


function setBackground(color){

    background =
        color;
}


document
    .getElementById("speed")
    .addEventListener(
        "input",
        function(){

            speed =
                Number(this.value);
        }
    );


/* =========================
   الحلقة الرئيسية
========================= */

function animate(){

    if(playing){

        time += speed;
    }

    render();

    requestAnimationFrame(
        animate
    );
}


setAnimation("idle");

animate();

</script>

</body>
</html>
