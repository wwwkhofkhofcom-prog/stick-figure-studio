<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Figure Studio 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080a0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:58px;
  background:#10131b;
  border-bottom:1px solid #252a35;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:20px;
}

.logo{
  font-size:19px;
  font-weight:bold;
}

.logo span{
  color:#6c8cff;
}

.tool{
  background:#181c26;
  border:1px solid #292f3b;
  color:white;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}

.tool:hover{
  background:#222837;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  min-height:0;
}

/* LEFT */
.left{
  width:220px;
  background:#0e1118;
  border-right:1px solid #252a35;
  padding:15px;
}

.section{
  margin-bottom:25px;
}

.section h3{
  font-size:12px;
  color:#8d95a8;
  margin-bottom:12px;
  text-transform:uppercase;
}

.item{
  background:#171b24;
  border:1px solid #292f3b;
  padding:11px;
  border-radius:8px;
  margin-bottom:8px;
  cursor:pointer;
}

.item:hover{
  background:#202635;
}

/* VIEWPORT */
.viewport{
  flex:1;
  position:relative;
  background:#11151d;
  overflow:hidden;
}

#scene{
  width:100%;
  height:100%;
  display:block;
}

.help{
  position:absolute;
  bottom:15px;
  left:15px;
  background:rgba(0,0,0,.55);
  padding:9px 13px;
  border-radius:8px;
  font-size:12px;
  color:#b9c0cf;
}

/* RIGHT */
.right{
  width:230px;
  background:#0e1118;
  border-left:1px solid #252a35;
  padding:15px;
}

.control{
  margin-bottom:18px;
}

.control label{
  display:block;
  color:#9da5b8;
  font-size:12px;
  margin-bottom:7px;
}

input[type=range]{
  width:100%;
}

/* TIMELINE */
.timeline{
  height:180px;
  background:#0b0e14;
  border-top:1px solid #252a35;
  padding:12px;
}

.timeline-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.play{
  background:#6c8cff;
  border:none;
  color:white;
  padding:8px 18px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.track{
  height:45px;
  background:#151922;
  border:1px solid #292f3b;
  border-radius:6px;
  position:relative;
}

.key{
  width:10px;
  height:10px;
  background:#ffcc4d;
  position:absolute;
  top:17px;
  transform:rotate(45deg);
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="logo">
      Stick Figure <span>Studio 3D</span>
    </div>

    <button class="tool" onclick="resetCamera()">Reset Camera</button>
    <button class="tool" onclick="addKeyframe()">◆ Keyframe</button>
  </div>

  <div class="main">

    <!-- LEFT PANEL -->
    <aside class="left">

      <div class="section">
        <h3>Scene</h3>

        <div class="item" onclick="selectPart('body')">
          🧍 Character
        </div>

        <div class="item">
          ◼ Ground
        </div>

        <div class="item">
          💡 Light
        </div>

        <div class="item">
          📷 Camera
        </div>
      </div>

      <div class="section">
        <h3>Animation</h3>

        <div class="item" onclick="animateWalk()">
          🚶 Walk
        </div>

        <div class="item" onclick="animateJump()">
          🦘 Jump
        </div>

        <div class="item" onclick="animateWave()">
          👋 Wave
        </div>
      </div>

    </aside>


    <!-- 3D VIEWPORT -->
    <main class="viewport">
      <canvas id="scene"></canvas>

      <div class="help">
        Drag = Rotate Camera &nbsp; | &nbsp;
        Wheel = Zoom
      </div>
    </main>


    <!-- RIGHT PANEL -->
    <aside class="right">

      <div class="section">
        <h3>Character</h3>

        <div class="control">
          <label>Arm Rotation</label>
          <input
            type="range"
            min="-180"
            max="180"
            value="0"
            oninput="rotateArm(this.value)"
          >
        </div>

        <div class="control">
          <label>Leg Rotation</label>
          <input
            type="range"
            min="-180"
            max="180"
            value="0"
            oninput="rotateLeg(this.value)"
          >
        </div>

        <div class="control">
          <label>Head Rotation</label>
          <input
            type="range"
            min="-180"
            max="180"
            value="0"
            oninput="rotateHead(this.value)"
          >
        </div>

      </div>

      <div class="section">
        <h3>Environment</h3>

        <div class="control">
          <label>Light</label>
          <input type="range" min="0" max="2" step=".01" value="1"
                 oninput="changeLight(this.value)">
        </div>

      </div>

    </aside>

  </div>


  <!-- TIMELINE -->
  <div class="timeline">

    <div class="timeline-head">
      <strong>Timeline</strong>

      <div>
        <button class="play" onclick="togglePlay()" id="playBtn">
          ▶ Play
        </button>
      </div>
    </div>

    <div class="track" id="track">
      <div class="key" style="left:20px"></div>
      <div class="key" style="left:160px"></div>
    </div>

  </div>

</div>


<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true
});

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
  canvas.clientWidth,
  canvas.clientHeight
);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
  45,
  canvas.clientWidth / canvas.clientHeight,
  0.1,
  1000
);

camera.position.set(5,4,7);


/* SCENE */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x11151d);


/* LIGHT */

const ambient = new THREE.AmbientLight(
  0xffffff,
  1
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(5,8,5);

scene.add(light);


/* GROUND */

const groundGeometry =
  new THREE.PlaneGeometry(20,20);

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color:0x202631
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* CHARACTER */

const character = new THREE.Group();

scene.add(character);


/* MATERIAL */

const material =
  new THREE.MeshStandardMaterial({
    color:0xffffff
  });


/* CREATE CYLINDER BONE */

function bone(length, radius=.08){

  const geometry =
    new THREE.CylinderGeometry(
      radius,
      radius,
      length,
      12
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  return mesh;
}


/* BODY */

const body =
  bone(2,.12);

body.position.y=2.3;

character.add(body);


/* HEAD */

const headGeometry =
  new THREE.SphereGeometry(
    .45,
    24,
    24
  );

const head =
  new THREE.Mesh(
    headGeometry,
    material
  );

head.position.y=3.55;

character.add(head);


/* ARMS */

const leftArm =
  bone(1.5,.09);

leftArm.position.set(-.9,2.65,0);

leftArm.rotation.z=-.35;

character.add(leftArm);


const rightArm =
  bone(1.5,.09);

rightArm.position.set(.9,2.65,0);

rightArm.rotation.z=.35;

character.add(rightArm);


/* LEGS */

const leftLeg =
  bone(1.8,.1);

leftLeg.position.set(-.35,1,0);

leftLeg.rotation.z=-.12;

character.add(leftLeg);


const rightLeg =
  bone(1.8,.1);

rightLeg.position.set(.35,1,0);

rightLeg.rotation.z=.12;

character.add(rightLeg);


/* CAMERA CONTROL */

let dragging=false;
let lastX=0;
let lastY=0;

canvas.addEventListener("mousedown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

window.addEventListener("mouseup",()=>{
  dragging=false;
});

window.addEventListener("mousemove",e=>{

  if(!dragging) return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  camera.position.x += dx*.01;
  camera.position.y -= dy*.01;

  camera.lookAt(0,2,0);

  lastX=e.clientX;
  lastY=e.clientY;
});


canvas.addEventListener("wheel",e=>{

  camera.position.z += e.deltaY*.01;

  camera.position.z =
    Math.max(3,Math.min(15,camera.position.z));

});


/* CONTROLS */

function rotateArm(value){

  rightArm.rotation.z =
    THREE.MathUtils.degToRad(
      Number(value)
    );

}


function rotateLeg(value){

  rightLeg.rotation.z =
    THREE.MathUtils.degToRad(
      Number(value)
    );

}


function rotateHead(value){

  head.rotation.y =
    THREE.MathUtils.degToRad(
      Number(value)
    );

}


function changeLight(value){

  ambient.intensity =
    Number(value);

}


/* CAMERA RESET */

function resetCamera(){

  camera.position.set(5,4,7);

  camera.lookAt(0,2,0);

}


/* KEYFRAME */

function addKeyframe(){

  const track =
    document.getElementById("track");

  const key =
    document.createElement("div");

  key.className="key";

  key.style.left =
    Math.random()*90+"%";

  track.appendChild(key);

}


/* ANIMATIONS */

let animation=null;

function animateWalk(){

  animation="walk";

}

function animateJump(){

  animation="jump";

}

function animateWave(){

  animation="wave";

}


/* PLAY */

let playing=false;

function togglePlay(){

  playing=!playing;

  document.getElementById("playBtn").innerText =
    playing ? "⏸ Pause" : "▶ Play";

}


/* LOOP */

let time=0;

function render(){

  requestAnimationFrame(render);

  time+=.03;

  if(playing){

    if(animation==="walk"){

      leftLeg.rotation.z =
        Math.sin(time*5)*.5;

      rightLeg.rotation.z =
        Math.sin(time*5+Math.PI)*.5;

      leftArm.rotation.z =
        Math.sin(time*5+Math.PI)*.4;

      rightArm.rotation.z =
        Math.sin(time*5)*.4;

    }

    if(animation==="jump"){

      character.position.y =
        Math.abs(Math.sin(time*3))*1.5;

    }

    if(animation==="wave"){

      rightArm.rotation.z =
        Math.sin(time*5)*1.2;

    }

  }

  renderer.render(
    scene,
    camera
  );

}


/* RESIZE */

window.addEventListener("resize",()=>{

  camera.aspect =
    canvas.clientWidth /
    canvas.clientHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    canvas.clientWidth,
    canvas.clientHeight
  );

});


camera.lookAt(0,2,0);

render();

</script>

</body>
</html>
