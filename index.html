<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stick Figure Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0d12;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    height:65px;
    background:#11151d;
    border-bottom:1px solid #292e39;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#8b5cf6;
}

.app{
    display:flex;
    height:calc(100vh - 65px);
}

.workspace{
    flex:1;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.canvasBox{
    width:min(1000px,100%);
    height:min(700px,85vh);
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 70px rgba(0,0,0,.4);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.sidebar{
    width:310px;
    background:#11151d;
    border-left:1px solid #292e39;
    padding:20px;
    overflow:auto;
}

h2{
    margin:0 0 20px;
}

.title{
    color:#9ca3af;
    font-size:12px;
    margin:20px 0 10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    border:0;
    background:#1c222d;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#2a3140;
}

button.active{
    background:#8b5cf6;
}

.mainBtn{
    width:100%;
    margin-top:15px;
    background:#8b5cf6;
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

@media(max-width:800px){

    .app{
        flex-direction:column;
        height:auto;
    }

    .workspace{
        min-height:55vh;
        padding:10px;
    }

    .canvasBox{
        height:50vh;
    }

    .sidebar{
        width:100%;
        border-left:0;
        border-top:1px solid #292e39;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 <span>Stick Figure</span> Studio</div>
    <div id="status">● جاهز</div>
</header>

<div class="app">

    <main class="workspace">

        <div class="canvasBox">
            <canvas id="canvas"></canvas>
        </div>

    </main>

    <aside class="sidebar">

        <h2>🎭 الشخصية</h2>

        <div class="title">التعبير</div>

        <div class="grid">
            <button onclick="setFace('happy')">😊 سعيد</button>
            <button onclick="setFace('laugh')">😂 يضحك</button>
            <button onclick="setFace('angry')">😡 غاضب</button>
            <button onclick="setFace('sad')">😭 حزين</button>
            <button onclick="setFace('surprised')">😮 مندهش</button>
            <button onclick="setFace('smirk')">😏 ماكر</button>
        </div>

        <div class="title">الحركة</div>

        <div class="grid">

            <button onclick="setAnimation('idle')">
                🧍 وقوف
            </button>

            <button onclick="setAnimation('walk')">
                🚶 مشي
            </button>

            <button onclick="setAnimation('run')">
                🏃 ركض
            </button>

            <button onclick="setAnimation('jump')">
                🦘 قفز
            </button>

            <button onclick="setAnimation('fall')">
                🤸 سقوط
            </button>

            <button onclick="setAnimation('punch')">
                👊 لكم
            </button>

            <button onclick="setAnimation('wave')">
                👋 تلويح
            </button>

        </div>

        <div class="title">
            سرعة الحركة
        </div>

        <input
            id="speed"
            type="range"
            min=".2"
            max="3"
            step=".1"
            value="1"
        >

        <button
            class="mainBtn"
            onclick="togglePlay()"
        >
            ▶ تشغيل / إيقاف
        </button>

    </aside>

</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W,H;

let time = 0;

let playing = true;

let speed = 1;

let animation = "idle";

let face = "happy";

function resize(){

    const r =
        canvas.getBoundingClientRect();

    W = r.width;
    H = r.height;

    canvas.width =
        W * devicePixelRatio;

    canvas.height =
        H * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   أدوات الرسم
========================= */

function line(
    x1,y1,
    x2,y2
){

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.stroke();
}


function circle(
    x,y,r
){

    ctx.beginPath();

    ctx.arc(
        x,y,r,
        0,
        Math.PI*2
    );

    ctx.stroke();
}


function filledCircle(
    x,y,r
){

    ctx.beginPath();

    ctx.arc(
        x,y,r,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   الوجه
========================= */

function drawFace(
    x,
    y,
    scale
){

    ctx.strokeStyle="#111";

    ctx.fillStyle="#111";

    ctx.lineWidth=5;

    const eyeY =
        y - 112*scale;

    const eyeX =
        12*scale;


    /* العيون */

    if(face==="happy"){

        ctx.beginPath();
        ctx.arc(
            x-eyeX,
            eyeY,
            6*scale,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.arc(
            x+eyeX,
            eyeY,
            6*scale,
            0,
            Math.PI*2
        );
        ctx.fill();

    }


    if(face==="laugh"){

        ctx.beginPath();

        ctx.arc(
            x-eyeX,
            eyeY,
            8*scale,
            0,
            Math.PI
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.arc(
            x+eyeX,
            eyeY,
            8*scale,
            0,
            Math.PI
        );

        ctx.stroke();

    }


    if(face==="angry"){

        line(
            x-25*scale,
            eyeY-12*scale,
            x-4*scale,
            eyeY-4*scale
        );

        line(
            x+25*scale,
            eyeY-12*scale,
            x+4*scale,
            eyeY-4*scale
        );

        filledCircle(
            x-eyeX,
            eyeY,
            5*scale
        );

        filledCircle(
            x+eyeX,
            eyeY,
            5*scale
        );

    }


    if(face==="sad"){

        filledCircle(
            x-eyeX,
            eyeY,
            5*scale
        );

        filledCircle(
            x+eyeX,
            eyeY,
            5*scale
        );

        ctx.strokeStyle="#38bdf8";

        line(
            x-eyeX,
            eyeY+7*scale,
            x-eyeX,
            eyeY+18*scale
        );

        line(
            x+eyeX,
            eyeY+7*scale,
            x+eyeX,
            eyeY+18*scale
        );

        ctx.strokeStyle="#111";

    }


    if(face==="surprised"){

        filledCircle(
            x-eyeX,
            eyeY,
            5*scale
        );

        filledCircle(
            x+eyeX,
            eyeY,
            5*scale
        );

        ctx.beginPath();

        ctx.arc(
            x,
            eyeY+25*scale,
            10*scale,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    if(face==="smirk"){

        filledCircle(
            x-eyeX,
            eyeY,
            5*scale
        );

        filledCircle(
            x+eyeX,
            eyeY,
            5*scale
        );

    }


    /* الفم */

    ctx.strokeStyle="#111";

    if(face==="happy"){

        ctx.beginPath();

        ctx.arc(
            x,
            y-98*scale,
            18*scale,
            0,
            Math.PI
        );

        ctx.stroke();

    }

    if(face==="laugh"){

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            x,
            y-95*scale,
            20*scale,
            0,
            Math.PI
        );

        ctx.fill();

    }

    if(face==="angry"){

        line(
            x-15*scale,
            y-90*scale,
            x+15*scale,
            y-90*scale
        );

    }

    if(face==="sad"){

        ctx.beginPath();

        ctx.arc(
            x,
            y-82*scale,
            18*scale,
            Math.PI,
            Math.PI*2
        );

        ctx.stroke();

    }

    if(face==="smirk"){

        line(
            x-3*scale,
            y-88*scale,
            x+18*scale,
            y-92*scale
        );

    }
}


/* =========================
   الشخصية
========================= */

function drawCharacter(){

    const scale =
        Math.min(W,H)/500;

    const x =
        W/2;

    let baseY =
        H-145*scale;


    /* الحركة */

    let walk=0;

    let jump=0;

    let rotation=0;


    if(animation==="walk"){

        walk =
            Math.sin(time*.15)*28*scale;
    }


    if(animation==="run"){

        walk =
            Math.sin(time*.25)*42*scale;

        baseY -=
            Math.abs(
                Math.sin(time*.25)
            )*8*scale;
    }


    if(animation==="jump"){

        jump =
            Math.abs(
                Math.sin(time*.08)
            )*100*scale;

        baseY -= jump;
    }


    if(animation==="fall"){

        rotation =
            Math.sin(time*.06)*.5;

        baseY +=
            Math.abs(
                Math.sin(time*.08)
            )*80*scale;
    }


    ctx.save();

    ctx.translate(
        x,
        baseY
    );

    ctx.rotate(rotation);

    ctx.translate(
        -x,
        -baseY
    );


    ctx.strokeStyle="#111";

    ctx.fillStyle="#111";

    ctx.lineWidth =
        7*scale;

    ctx.lineCap="round";

    ctx.lineJoin="round";


    /* الرأس */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        x,
        baseY-145*scale,
        55*scale,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    /* الشعر */

    ctx.strokeStyle="#111";

    line(
        x-8*scale,
        baseY-198*scale,
        x-3*scale,
        baseY-210*scale
    );

    line(
        x,
        baseY-198*scale,
        x+5*scale,
        baseY-210*scale
    );


    /* الوجه */

    drawFace(
        x,
        baseY-35*scale,
        scale
    );


    /* الرقبة */

    line(
        x,
        baseY-90*scale,
        x,
        baseY-65*scale
    );


    /* الجسم */

    line(
        x,
        baseY-65*scale,
        x,
        baseY+25*scale
    );


    /* الذراعين */

    if(animation==="wave"){

        /* يد مرفوعة */

        line(
            x,
            baseY-50*scale,
            x-45*scale,
            baseY-105*scale
        );

        line(
            x-45*scale,
            baseY-105*scale,
            x-40*scale,
            baseY-145*scale
        );

        /* الكف */

        filledCircle(
            x-40*scale,
            baseY-150*scale,
            9*scale
        );

    }else if(animation==="punch"){

        line(
            x,
            baseY-50*scale,
            x+75*scale,
            baseY-55*scale
        );

        filledCircle(
            x+82*scale,
            baseY-55*scale,
            10*scale
        );

        line(
            x,
            baseY-50*scale,
            x-40*scale,
            baseY-10*scale
        );

    }else{

        line(
            x,
            baseY-50*scale,
            x-55*scale,
            baseY-5*scale
        );

        line(
            x,
            baseY-50*scale,
            x+55*scale,
            baseY-5*scale
        );

        /* الكفوف */

        filledCircle(
            x-58*scale,
            baseY-2*scale,
            8*scale
        );

        filledCircle(
            x+58*scale,
            baseY-2*scale,
            8*scale
        );
    }


    /* الرجلين */

    line(
        x,
        baseY+25*scale,
        x-38*scale+walk,
        baseY+105*scale
    );

    line(
        x,
        baseY+25*scale,
        x+38*scale-walk,
        baseY+105*scale
    );


    /* القدمين */

    ctx.lineWidth =
        14*scale;

    line(
        x-38*scale+walk,
        baseY+105*scale,
        x-60*scale+walk,
        baseY+105*scale
    );

    line(
        x+38*scale-walk,
        baseY+105*scale,
        x+60*scale-walk,
        baseY+105*scale
    );


    ctx.restore();
}


/* =========================
   الخلفية
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* الأرض */

    ctx.strokeStyle="#dedede";

    ctx.lineWidth=3;

    line(
        0,
        H-40,
        W,
        H-40
    );


    drawCharacter();
}


/* =========================
   التحكم
========================= */

function setAnimation(type){

    animation=type;

    document.getElementById(
        "status"
    ).textContent =
        "● "+type;
}


function setFace(type){

    face=type;

    document.getElementById(
        "status"
    ).textContent =
        "● "+type;
}


function togglePlay(){

    playing=!playing;

    document.getElementById(
        "status"
    ).textContent =
        playing
        ? "● يعمل"
        : "Ⅱ متوقف";
}


document.getElementById(
    "speed"
).addEventListener(
    "input",
    e=>{
        speed=
            Number(e.target.value);
    }
);


/* =========================
   التشغيل
========================= */

function loop(){

    if(playing){

        time+=speed;
    }

    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
